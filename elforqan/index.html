    <script>
        (() => {
            const responsiveStyles = [
                ["style/media/large-screen.css", "screen and (min-width: 1181px)"],
                ["style/media/meduim-screen.css", "screen and (max-width: 1180px)"],
                ["style/media/small-screen.css", "screen and (max-width: 670px)"]
            ];

            responsiveStyles.forEach(([href, mediaQuery]) => {
                const query = window.matchMedia(mediaQuery);
                let stylesheet;

                const updateStylesheet = () => {
                    if (query.matches && !stylesheet) {
                        stylesheet = document.createElement("link");
                        stylesheet.rel = "stylesheet";
                        stylesheet.href = href;
                        document.head.appendChild(stylesheet);
                    } else if (!query.matches && stylesheet) {
                        stylesheet.remove();
                        stylesheet = null;
                    }
                };

                updateStylesheet();
                query.addEventListener("change", updateStylesheet);
            });
        })();
    </script>
